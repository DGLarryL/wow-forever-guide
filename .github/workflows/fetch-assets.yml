name: Fetch website assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download maps and WoW icons
        run: python3 scripts/fetch_assets.py

      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Add local website assets"
            git push
          fi
